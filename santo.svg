<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Animated Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A">
        <animate attributeName="stop-color"
          values="#0F172A;#111827;#1E1B4B;#0F172A"
          dur="12s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#1E3A8A">
        <animate attributeName="stop-color"
          values="#1E3A8A;#312E81;#0F172A;#1E3A8A"
          dur="12s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Animated Text Gradient -->
    <linearGradient id="gradientText">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color"
          values="#38BDF8;#8B5CF6;#EC4899;#22C55E;#38BDF8"
          dur="6s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#EC4899">
        <animate attributeName="stop-color"
          values="#EC4899;#F97316;#38BDF8;#EC4899"
          dur="6s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="25" fill="url(#bg)"/>

  <!-- Light Sweep -->
  <rect x="-350"
        y="-50"
        width="180"
        height="420"
        fill="white"
        opacity="0.05"
        transform="rotate(-20)">
    <animate attributeName="x"
             values="-350;1500"
             dur="7s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Floating Particles -->
  <g fill="#ffffff">

    <circle cx="80" cy="40" r="2">
      <animate attributeName="cy" values="40;290;40" dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="180" cy="280" r="2">
      <animate attributeName="cy" values="280;30;280" dur="8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="320" cy="30" r="2">
      <animate attributeName="cy" values="30;290;30" dur="7s" repeatCount="indefinite"/>
    </circle>

    <circle cx="480" cy="260" r="2">
      <animate attributeName="cy" values="260;20;260" dur="11s" repeatCount="indefinite"/>
    </circle>

    <circle cx="650" cy="40" r="2">
      <animate attributeName="cy" values="40;290;40" dur="8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="850" cy="280" r="2">
      <animate attributeName="cy" values="280;20;280" dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1030" cy="30" r="2">
      <animate attributeName="cy" values="30;280;30" dur="10s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Decorative Lines -->
  <line x1="120" y1="70" x2="1080" y2="70"
        stroke="#334155"
        stroke-width="1"
        opacity="0.3"/>

  <line x1="120" y1="250" x2="1080" y2="250"
        stroke="#334155"
        stroke-width="1"
        opacity="0.3"/>

  <!-- Name -->
  <text
      x="600"
      y="145"
      text-anchor="middle"
      font-family="Segoe UI, Arial"
      font-size="52"
      font-weight="700"
      fill="url(#gradientText)"
      filter="url(#glow)">

      Md Sakibul Hasan Santo

      <animateTransform
          attributeName="transform"
          type="scale"
          values="1;1.02;1"
          additive="sum"
          dur="3s"
          repeatCount="indefinite"/>

  </text>

  <!-- Subtitle -->
  <text
      x="600"
      y="195"
      text-anchor="middle"
      font-family="Segoe UI"
      font-size="24"
      fill="#E2E8F0">

      Flutter • Kotlin • Java • Golang

      <animate attributeName="opacity"
               values="0.5;1;0.5"
               dur="2.5s"
               repeatCount="indefinite"/>

  </text>

  <!-- Footer -->
  <text
      x="600"
      y="235"
      text-anchor="middle"
      font-family="Consolas"
      font-size="17"
      fill="#94A3B8">

      Building Beautiful Mobile & Backend Applications

  </text>

</svg>
